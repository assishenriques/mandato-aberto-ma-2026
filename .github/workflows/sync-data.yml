name: Sincronizar bases oficiais do painel

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  push:
    paths:
      - ".github/workflows/sync-data.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar, filtrar e publicar arquivos seguros do TSE
        run: |
          python - <<'PY'
          import csv, io, json, re, urllib.request, zipfile, datetime, os

          sources = {
              "consulta_cand_2026_MA.csv": "https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_2026.zip",
              "consulta_cand_complementar_2026_MA.csv": "https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand_complementar/consulta_cand_complementar_2026.zip",
          }
          def clean(value):
              value = (value or "").strip()
              return "" if value in {"#NULO", "#NE", "#NI", "NÃO DIVULGÁVEL"} else value
          def extract_csv(url, target_name):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 mandato-aberto-ma-2026"})
              with urllib.request.urlopen(req, timeout=120) as response:
                  archive = zipfile.ZipFile(io.BytesIO(response.read()))
              members = [n for n in archive.namelist() if n.lower().endswith(target_name.lower())]
              if not members:
                  raise RuntimeError(f"CSV não encontrado no pacote: {target_name}")
              with archive.open(members[0]) as stream:
                  text = io.TextIOWrapper(stream, encoding="latin-1", newline="")
                  return list(csv.DictReader(text, delimiter=";"))
          raw_primary = extract_csv(sources["consulta_cand_2026_MA.csv"], "consulta_cand_2026_MA.csv")
          raw_complement = extract_csv(sources["consulta_cand_complementar_2026_MA.csv"], "consulta_cand_complementar_2026_MA.csv")
          primary_columns = ["SQ_CANDIDATO","NM_URNA_CANDIDATO","NM_CANDIDATO","NR_CANDIDATO","SG_PARTIDO","DS_CARGO","DS_SITUACAO_CANDIDATURA","DS_SITUACAO_JULGAMENTO_PLEITO","DS_SITUACAO_JULGAMENTO","DS_SITUACAO_CANDIDATO_PLEITO","DS_SIT_TOT_TURNO","DS_GENERO","DS_OCUPACAO","DS_COMPOSICAO_FEDERACAO","NM_FEDERACAO","SG_UF","URL_CANDIDATO","URL_DIVULGACAND"]
          complement_columns = ["SQ_CANDIDATO","NR_IDADE_DATA_POSSE","NM_MUNICIPIO_NASCIMENTO","ST_REELEICAO"]
          primary = [r for r in raw_primary if clean(r.get("SG_UF")) == "MA"]
          by_id = {clean(r.get("SQ_CANDIDATO")):r for r in primary if clean(r.get("SQ_CANDIDATO"))}
          complement = [r for r in raw_complement if clean(r.get("SQ_CANDIDATO")) in by_id]
          for row in complement:
              target = by_id[clean(row.get("SQ_CANDIDATO"))]
              for key in complement_columns[1:]: target[key] = clean(row.get(key))
          os.makedirs("data", exist_ok=True)
          def write_csv(path, rows, columns):
              with open(path, "w", encoding="utf-8-sig", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=columns, delimiter=";", lineterminator="\r\n", extrasaction="ignore")
                  writer.writeheader()
                  for row in rows: writer.writerow({k:clean(row.get(k)) for k in columns})
          write_csv("data/consulta_cand_2026_MA.csv", primary, primary_columns)
          write_csv("data/consulta_cand_complementar_2026_MA.csv", complement, complement_columns)
          def first(row, *keys):
              return next((clean(row.get(k)) for k in keys if clean(row.get(k))), "")
          records = []
          for row in by_id.values():
              item = {
                  "id":clean(row.get("SQ_CANDIDATO")), "name":first(row,"NM_URNA_CANDIDATO","NM_CANDIDATO"),
                  "civil":clean(row.get("NM_CANDIDATO")), "number":clean(row.get("NR_CANDIDATO")),
                  "party":clean(row.get("SG_PARTIDO")), "cargo":clean(row.get("DS_CARGO")),
                  "status":first(row,"DS_SITUACAO_JULGAMENTO_PLEITO","DS_SITUACAO_JULGAMENTO","DS_SITUACAO_CANDIDATO_PLEITO","DS_SITUACAO_CANDIDATURA","DS_SIT_TOT_TURNO") or "Não informado",
                  "sex":clean(row.get("DS_GENERO")), "age":clean(row.get("NR_IDADE_DATA_POSSE")),
                  "reelect":clean(row.get("ST_REELEICAO")), "occupation":clean(row.get("DS_OCUPACAO")),
                  "city":clean(row.get("NM_MUNICIPIO_NASCIMENTO")),
                  "url":clean(row.get("URL_CANDIDATO")) or clean(row.get("URL_DIVULGACAND")) or "https://divulgacandcontas.tse.jus.br/",
                  "federation":first(row,"DS_COMPOSICAO_FEDERACAO","NM_FEDERACAO"), "uf":"MA"
              }
              if item["name"]: records.append(item)
          with open("data/initial-candidates.json","w",encoding="utf-8") as f:
              json.dump(records,f,ensure_ascii=False,separators=(",",":"))
          compat = [{"id":r["id"],"nome":r["name"],"nomeCivil":r["civil"],"cargo":r["cargo"],"partido":r["party"],"numero":r["number"],"uf":"MA","situacao":r["status"],"fonte":"https://dadosabertos.tse.jus.br/pt_BR/dataset/candidatos-2026"} for r in records]
          with open("data/candidatos.json","w",encoding="utf-8") as f:
              json.dump(compat,f,ensure_ascii=False,separators=(",",":"))
          updated = datetime.datetime.now(datetime.timezone.utc).isoformat()
          meta = {"source":"Tribunal Superior Eleitoral (TSE)","election":"Eleições 2026","uf":"MA","updatedAt":updated,"candidateRecords":len(records),"files":[{"name":"consulta_cand_2026_MA.csv","source":sources["consulta_cand_2026_MA.csv"],"records":len(primary)},{"name":"consulta_cand_complementar_2026_MA.csv","source":sources["consulta_cand_complementar_2026_MA.csv"],"records":len(complement)}],"privacy":"Campos públicos necessários ao painel; identificadores pessoais e contatos excluídos."}
          with open("data/meta.json","w",encoding="utf-8") as f:
              json.dump(meta,f,ensure_ascii=False,indent=2)
              f.write("\n")
          with open("index.html",encoding="utf-8") as f: html=f.read()
          inline=json.dumps(records,ensure_ascii=False,separators=(",",":")).replace("<","\\u003c")
          updated_html, count = re.subn(r'<script id="initial-data" type="application/json">.*?</script>', lambda _: '<script id="initial-data" type="application/json">'+inline+'</script>', html, count=1, flags=re.S)
          if count != 1: raise RuntimeError("Bloco de dados embutidos não encontrado em index.html")
          with open("index.html","w",encoding="utf-8") as f: f.write(updated_html)
          print(f"Atualizados {len(records)} registros; complemento: {len(complement)}; {updated} UTC")
          PY

      - name: Coletar produção legislativa nas APIs oficiais
        run: python .github/scripts/sync_legislative.py

      - name: Commit e publicar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/candidatos.json data/initial-candidates.json data/meta.json data/consulta_cand_2026_MA.csv data/consulta_cand_complementar_2026_MA.csv data/producao-legislativa.json
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados."
            exit 0
          fi
          git commit -m "Atualiza dados oficiais do TSE"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

